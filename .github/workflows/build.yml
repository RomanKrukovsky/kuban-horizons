name: Build & Test

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Datagen freshness
        run: |
          ./gradlew runData --stacktrace
          if [ -n "$(git status --porcelain src/generated)" ]; then
            echo "::error::Datagen output differs from committed files. Run ./gradlew runData and commit."
            git status --porcelain src/generated
            exit 1
          fi

      - name: GameTest
        run: ./gradlew runGameTestServer --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: kubanhorizons-jar
          path: build/libs/*.jar
          if-no-files-found: error
