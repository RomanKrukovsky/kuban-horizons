plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Ресурсы, созданные datagen
    srcDir('src/generated/resources')

    // Исходники Blockbench и кэш datagen не попадают в JAR
    exclude("**/*.bbmodel")
    exclude(".cache/**")
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 26.2 поставляется с Java 25 — моды должны собираться под Java 25 (см. AD-002)
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Ключи диалогового разума джиннии.
//
// Читаются из гитигнорного local.properties и передаются в игру как
// переменные окружения. Переменная окружения процесса имеет приоритет:
// на сервере ключ задают через окружение, а local.properties нужен для
// локального запуска, где экспортировать переменную перед каждым
// ./gradlew runClient неудобно. Отсутствие файла или свойства ошибкой
// не является — джинния просто отвечает, что дальний разум недоступен.
var genieSecretKeys = ['EUROMODELS_API_KEY', 'OPENROUTER_API_KEY']
var localProperties = new Properties()
var localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
var genieSecrets = genieSecretKeys.collectEntries { name ->
    var value = System.getenv(name) ?: localProperties.getProperty(name)
    value == null || value.isBlank() ? [:] : [(name): value]
}

neoForge {
    version = project.neo_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Необязательный быстрый вход в мир: ./gradlew runClient -PkhQuickPlay="<каталог мира>"
            // Нужен для проверки сущностей и блоков без ручной навигации по меню;
            // без свойства поведение runClient не меняется. Значение — имя
            // каталога в run/saves, а не отображаемое имя мира.
            if (project.hasProperty('khQuickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.khQuickPlay
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Отдельный smoke-мир без изменения server.properties:
            // ./gradlew runServer -PkhServerWorld="имя-каталога"
            if (project.hasProperty('khServerWorld')) {
                programArguments.addAll '--world', project.khServerWorld
            }
        }

        // Запускает GameTestServer, прогоняет все зарегистрированные gametests и завершает работу
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
            // Ключи попадают в окружение всех запусков, включая datagen:
            // отдельная логика «кому какой ключ» только создала бы
            // конфигурацию, которая тихо расходится с реальностью.
            environment.putAll genieSecrets
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "maven.modrinth:geckolib:${geckolib_version}"

    testImplementation files('build/moddev/artifacts/minecraft-patched-26.2.0.48-beta-merged.jar')
    testImplementation "net.neoforged:neoforge:${neo_version}:universal"
    testImplementation 'it.unimi.dsi:fastutil:8.5.18'
    testImplementation 'com.mojang:datafixerupper:10.0.21'
    testImplementation 'io.netty:netty-codec-base:4.2.15.Final'
    testImplementation 'io.netty:netty-handler:4.2.15.Final'
    testImplementation 'org.joml:joml:1.10.8'
    testImplementation 'com.mojang:authlib:9.0.75'
    testImplementation 'com.mojang:logging:1.7.12'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            geckolib_version       : geckolib_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
